hyper_parameters:
  hiddens: [ 256, 256, 128, 128 ]
  framework: torch
  double_q: true
  dueling: true
  noisy: false
  adam_epsilon: .00015
  exploration_config:
    type: EpsilonGreedy
    epsilon_timesteps: 1000000
    initial_epsilon: 1
    final_epsilon: 0.01
  lr: 0.0001
  n_step: 5
  num_atoms: 1
  replay_buffer_config:
    capacity: 1000000
    prioritized_replay_alpha: 0.5
    prioritized_replay_beta: 1
    type: MultiAgentPrioritizedReplayBuffer
  num_gpus: 1
  num_cpus_per_worker: 1
  num_gpus_per_worker: 0.01
  num_envs_per_worker: 1
  num_workers: 8
  max_retries: 3
  num_steps_sampled_before_learning_starts: 100000
  rollout_fragment_length: 16
  target_network_update_freq: 50000
  train_batch_size: 256
  min_sample_timesteps_per_iteration: 10000
  always_attach_evaluation_results: True
log:
  save_file: "/home/seventheli/data/logging/simple_env"
  save_checkout: "/home/seventheli/data/checkpoints/simple_env"
  max_time: 360000
  max_run: 50000
  log: 1
